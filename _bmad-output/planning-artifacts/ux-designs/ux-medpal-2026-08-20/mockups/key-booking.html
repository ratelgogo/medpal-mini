<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedPal 预约流程参考稿 · 浅雾青绿</title>
  <style>
    /* Governed by DESIGN.md: light palette, large type, rounded cards, floating Tab language. */
    :root{--base:#f5fbfb;--card:#fff;--ink:#244849;--muted:#648080;--soft:#9cb1b2;--line:#dcecec;--teal:#5ad6cc;--teal-deep:#35beb7;--mint:#e1f9f6;--board:#dbeaec;--shadow:0 18px 42px rgba(65,139,137,.16)}
    *{box-sizing:border-box}body{margin:0;background:var(--board);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;display:flex;justify-content:center;min-height:100vh;padding:38px 20px}.board{display:flex;gap:42px;align-items:center;max-width:1080px;width:100%}.notes{max-width:430px}.eyebrow{color:#238d89;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.notes h1{font-size:40px;line-height:1.16;margin:14px 0}.notes p{font-size:18px;line-height:1.65;color:var(--muted);margin:0 0 24px}.ref{background:rgba(255,255,255,.72);border-radius:24px;padding:14px;box-shadow:var(--shadow)}.ref img{display:block;width:100%;height:150px;object-fit:cover;border-radius:18px}.ref small{display:block;color:var(--muted);font-size:14px;line-height:1.45;margin:12px 2px 0}
    .phone{width:390px;height:860px;border:8px solid #fff;border-radius:42px;background:var(--base);box-shadow:0 26px 64px rgba(65,139,137,.27);overflow:hidden;position:relative;flex:none}.phone:before{content:"";position:absolute;z-index:3;top:8px;left:50%;width:112px;height:24px;transform:translateX(-50%);border-radius:0 0 16px 16px;background:#1e3d3e}.status{height:36px;padding:12px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:800}.screen{height:calc(100% - 36px);overflow:hidden;padding:0 20px 112px}.top{display:flex;align-items:center;gap:14px;padding:18px 0 22px}.back{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#238d89;font-size:28px}.top h1{font-size:24px;margin:0}.doctor-hero{display:flex;gap:16px;align-items:center;background:linear-gradient(145deg,#effdfb,#fff);border-radius:24px;padding:22px;margin-bottom:24px}.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#bfe8e3,#78c9c2);display:grid;place-items:center;color:#286463;font-size:24px;font-weight:800}.doctor-hero strong{font-size:21px}.doctor-hero p{font-size:15px;line-height:1.5;color:var(--muted);margin:6px 0 10px}.verified{font-size:13px;color:#238d89;background:var(--mint);border-radius:999px;padding:7px 10px;font-weight:700}.section{margin:0 0 24px}.section h2{font-size:20px;margin:0 0 12px}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.day{background:#fff;border:1px solid var(--line);border-radius:16px;text-align:center;padding:14px 2px;font-size:14px;color:var(--muted);min-height:72px}.day b{display:block;font-size:21px;color:var(--ink);margin-top:4px}.day.selected{background:var(--teal-deep);color:#fff;border-color:var(--teal-deep)}.day.selected b{color:#fff}.times{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.time{height:54px;border:1px solid var(--line);border-radius:16px;background:#fff;color:#238d89;font-weight:800;font-size:17px}.time.selected{background:var(--mint);border:3px solid var(--teal);color:#238d89}.time.disabled{color:var(--soft);background:#eef5f5;text-decoration:line-through}.notice{background:#fff5e6;border-radius:16px;padding:16px;font-size:14px;color:#85683d;line-height:1.55}.bottom{position:absolute;left:8px;right:8px;bottom:0;background:rgba(255,255,255,.98);padding:14px 20px 18px}.cta{width:100%;height:54px;border:0;border-radius:999px;background:var(--teal);color:var(--ink);font-size:17px;font-weight:800}
    @media(max-width:760px){body{padding:16px 10px}.board{display:block}.notes{display:none}.phone{margin:0 auto;width:min(390px,100%);height:calc(100vh - 32px);min-height:760px}}
  </style>
</head>
<body><main class="board"><section class="notes"><div class="eyebrow">MedPal / Booking</div><h1>预约：更大、更清楚</h1><p>日期、时间、已选和已约满都使用更大的文字与卡片。参考图的浅色设备和青绿色圆角语言保持一致，底部主按钮也做成大尺寸。</p><div class="ref"><img src="../imports/reference-dental-healthcare.jpeg" alt="上传的医疗预约视觉参考图"><small>视觉来源：imports/reference-dental-healthcare.jpeg · 浅色主题 / 白色设备 / 圆角信息卡</small></div></section><section class="phone" aria-label="MedPal 预约选择静态参考稿"><div class="status"><span>9:41</span><span>▮▮ ◉ ᯤ</span></div><div class="screen"><div class="top"><button class="back">‹</button><h1>预约李医生</h1></div><section class="doctor-hero"><div class="avatar">李</div><div><strong>李医生</strong><p>副主任医师 · 口腔科<br>擅长牙体牙髓与综合治疗</p><span class="verified">已认证执业信息</span></div></section><section class="section"><h2>选择日期</h2><div class="days"><div class="day"><span>今天</span><b>20</b></div><div class="day selected"><span>明天</span><b>21</b></div><div class="day"><span>周六</span><b>22</b></div><div class="day"><span>周日</span><b>23</b></div></div></section><section class="section"><h2>选择时间 <em style="font-size:14px;font-style:normal;color:var(--muted);font-weight:400">明天 · 4 个可选</em></h2><div class="times"><button class="time">09:30</button><button class="time selected">10:30 · 已选</button><button class="time disabled">11:30 · 已约满</button><button class="time">14:00</button></div></section><div class="notice">预约提交后，医院将在 10 分钟内确认。号源可能实时变化，请以提交结果为准。</div></div><div class="bottom"><button class="cta">确认 10:30 · 下一步</button></div></section></main></body>
</html>
